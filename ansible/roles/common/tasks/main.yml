- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: [sudo]
    append: true

- name: Ensure time sync is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Allow required TCP ports through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ allowed_tcp_ports }}"

- name: Enable firewall (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Harden SSH - no root login, no password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    validate: sshd -t -f %s
  loop:
    - { key: PermitRootLogin, value: "no" }
    - { key: PasswordAuthentication, value: "no" }
  notify: Restart sshd
