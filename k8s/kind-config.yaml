# Local Kubernetes cluster for this project: 1 control plane + 2 workers.
#   kind create cluster --name payflow --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # NodePort of the payflow-api Service
        hostPort: 30080
  - role: worker
  - role: worker
