apiVersion: v1
kind: Service
metadata:
  name: payflow-api
  namespace: payflow
spec:
  type: NodePort
  # in-memory demo store: keep each client on the same pod so create -> read works
  sessionAffinity: ClientIP
  selector: { app: payflow-api }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
