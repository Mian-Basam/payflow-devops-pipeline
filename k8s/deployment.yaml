apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-api
  namespace: payflow
  labels: { app: payflow-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5          # enables `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: payflow-api }
  template:
    metadata:
      labels: { app: payflow-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: payflow-api:local
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true      # nothing in the image can be modified at runtime
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp                       # gunicorn needs a writable /tmp for worker heartbeats
              mountPath: /tmp
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: payflow-config }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              # Endpoint removal and SIGTERM happen in parallel; keep serving
              # for a few seconds so the Service stops routing here first.
              exec: { command: ["sleep", "5"] }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
