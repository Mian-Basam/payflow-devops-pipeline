# Local "mini data center": app behind nginx, scraped by Prometheus,
# visualised in Grafana.  `make up` then open http://localhost:8080
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: payflow-api:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
    expose: ["8000"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
